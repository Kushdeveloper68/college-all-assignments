<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 11 - Job Application Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4 mb-5">
  <h2 class="text-center mb-4">Job Application Form</h2>

  <form>
    <div class="row g-3">

      <!-- Simple text input -->
      <div class="col-md-6">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" placeholder="Enter your full name" required>
      </div>

      <!-- Input group with text addon (icon style) -->
      <div class="col-md-6">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text">@</span>
          <input type="email" class="form-control" placeholder="name@example.com" required>
        </div>
      </div>

      <!-- Input group with prefix -->
      <div class="col-md-6">
        <label class="form-label">Mobile Number</label>
        <div class="input-group">
          <span class="input-group-text">+91</span>
          <input type="text" class="form-control" placeholder="10 digit mobile number" required>
        </div>
      </div>

      <div class="col-md-6">
        <label class="form-label">Date of Birth</label>
        <input type="date" class="form-control" required>
      </div>

      <div class="col-12">
        <label class="form-label">Address</label>
        <input type="text" class="form-control" placeholder="House no, street, area">
      </div>

      <div class="col-md-6">
        <label class="form-label">City</label>
        <input type="text" class="form-control" placeholder="City">
      </div>

      <div class="col-md-6">
        <label class="form-label">State</label>
        <input type="text" class="form-control" placeholder="State">
      </div>

      <!-- Input group containing a dropdown -->
      <div class="col-md-6">
        <label class="form-label">Highest Qualification</label>
        <div class="input-group">
          <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
            Select
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Diploma</a></li>
            <li><a class="dropdown-item" href="#">Bachelor's Degree</a></li>
            <li><a class="dropdown-item" href="#">Master's Degree</a></li>
          </ul>
          <input type="text" class="form-control" placeholder="Qualification selected" readonly>
        </div>
      </div>

      <!-- Input group with a button -->
      <div class="col-md-6">
        <label class="form-label">Skills</label>
        <div class="input-group">
          <input type="text" class="form-control" placeholder="e.g. HTML, CSS, Bootstrap">
          <button class="btn btn-primary" type="button">Add Skill</button>
        </div>
      </div>

      <!-- Input group with suffix -->
      <div class="col-md-6">
        <label class="form-label">Years of Experience</label>
        <div class="input-group">
          <input type="number" class="form-control" placeholder="0">
          <span class="input-group-text">Years</span>
        </div>
      </div>

      <!-- Input group with prefix and suffix -->
      <div class="col-md-6">
        <label class="form-label">Expected Salary</label>
        <div class="input-group">
          <span class="input-group-text">₹</span>
          <input type="number" class="form-control" placeholder="Expected amount">
          <span class="input-group-text">/ month</span>
        </div>
      </div>

      <!-- Input group with a checkbox -->
      <div class="col-md-6">
        <label class="form-label">Willing to Relocate</label>
        <div class="input-group">
          <div class="input-group-text">
            <input class="form-check-input mt-0" type="checkbox" aria-label="Willing to relocate checkbox">
          </div>
          <input type="text" class="form-control" placeholder="Yes / No, mention preferred city">
        </div>
      </div>

      <!-- Input group with radio buttons -->
      <div class="col-md-6">
        <label class="form-label">Job Type</label>
        <div class="input-group">
          <div class="input-group-text">
            <input class="form-check-input mt-0" type="radio" name="jobType" aria-label="Full time radio">
          </div>
          <span class="input-group-text">Full Time</span>
          <div class="input-group-text">
            <input class="form-check-input mt-0" type="radio" name="jobType" aria-label="Part time radio">
          </div>
          <span class="input-group-text">Part Time</span>
        </div>
      </div>

      <!-- File upload with button -->
      <div class="col-12">
        <label class="form-label">Upload Resume</label>
        <div class="input-group">
          <input type="file" class="form-control" accept=".pdf,.doc,.docx">
          <button class="btn btn-outline-secondary" type="button">Upload</button>
        </div>
      </div>

      <div class="col-12 mt-4">
        <button type="submit" class="btn btn-success">Submit Application</button>
        <button type="reset" class="btn btn-outline-secondary">Cancel</button>
      </div>

    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
