<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 8 - Student Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4 mb-5">
  <h2 class="text-center mb-4">Student Registration Form</h2>

  <form>
    <div class="row g-3">

      <div class="col-md-6">
        <label for="stuName" class="form-label">Student Name</label>
        <input type="text" class="form-control" id="stuName" placeholder="Enter full name" required>
      </div>

      <div class="col-md-6">
        <label for="enrollNo" class="form-label">Enrollment / Roll Number</label>
        <input type="text" class="form-control" id="enrollNo" placeholder="Enter enrollment number" required>
      </div>

      <div class="col-md-6">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
      </div>

      <div class="col-md-6">
        <label for="mobile" class="form-label">Mobile Number</label>
        <input type="text" class="form-control" id="mobile" placeholder="10 digit mobile number" required>
      </div>

      <div class="col-md-6">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" class="form-control" id="dob" required>
      </div>

      <div class="col-md-6">
        <label class="form-label d-block">Gender</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male">
          <label class="form-check-label" for="genderMale">Male</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
          <label class="form-check-label" for="genderFemale">Female</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
          <label class="form-check-label" for="genderOther">Other</label>
        </div>
      </div>

      <div class="col-12">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" id="address" placeholder="House no, street, area">
      </div>

      <div class="col-md-4">
        <label for="city" class="form-label">City</label>
        <input type="text" class="form-control" id="city" placeholder="City">
      </div>

      <div class="col-md-4">
        <label for="state" class="form-label">State</label>
        <input type="text" class="form-control" id="state" placeholder="State">
      </div>

      <div class="col-md-4">
        <label for="pincode" class="form-label">Pincode</label>
        <input type="number" class="form-control" id="pincode" placeholder="Pincode">
      </div>

      <div class="col-md-6">
        <label for="course" class="form-label">Course / Branch</label>
        <select id="course" class="form-select" required>
          <option selected disabled value="">Select branch</option>
          <option value="co">Computer Engineering</option>
          <option value="it">Information Technology</option>
          <option value="ec">Electronics and Communication</option>
          <option value="me">Mechanical Engineering</option>
          <option value="ce">Civil Engineering</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="semester" class="form-label">Semester</label>
        <select id="semester" class="form-select" required>
          <option selected disabled value="">Select semester</option>
          <option>1</option>
          <option>2</option>
          <option selected>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
        </select>
      </div>

      <div class="col-12">
        <label class="form-label d-block">Hobbies / Interests</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding">
          <label class="form-check-label" for="hobbyCoding">Coding</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
          <label class="form-check-label" for="hobbySports">Sports</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
          <label class="form-check-label" for="hobbyMusic">Music</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
          <label class="form-check-label" for="hobbyReading">Reading</label>
        </div>
      </div>

      <div class="col-12 mt-4">
        <button type="submit" class="btn btn-primary">Register</button>
        <button type="reset" class="btn btn-outline-secondary">Reset</button>
      </div>

    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
